name: Tagged release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Test and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_script: dist:win
          - os: ubuntu-latest
            package_script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Package application
        run: npm run ${{ matrix.package_script }}
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: co-agent-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: co-agent-*
          path: release
          merge-multiple: true
      - name: Publish release and attach packages
        uses: softprops/action-gh-release@v2
        with:
          name: CO-Agent ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
