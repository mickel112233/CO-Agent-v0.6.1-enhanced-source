name: CO-Agent CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: co-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run regression suite
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Verify release artifacts
        if: runner.os == 'Windows'
        run: npm run verify:release
      - name: Install and smoke-test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release\*.exe" | Where-Object { $_.Name -match 'Setup' } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not found." }
          $installDir = Join-Path $env:RUNNER_TEMP 'CO-Agent-Smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer exited with code $($install.ExitCode)." }
          $appExe = Join-Path $installDir 'CO-Agent.exe'
          if (-not (Test-Path $appExe)) { Get-ChildItem $installDir -Recurse | Select-Object FullName; throw "Installed CO-Agent.exe was not found." }
          $smoke = Start-Process -FilePath $appExe -ArgumentList '--co-agent-smoke-test' -Wait -PassThru -NoNewWindow
          if ($smoke.ExitCode -ne 0) { throw "Packaged application smoke test exited with code $($smoke.ExitCode)." }
          $uninstaller = Join-Path $installDir 'Uninstall CO-Agent.exe'
          if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }
      - name: Upload Windows installer for inspection
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CO-Agent-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
