name: CO-Agent CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: co-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Package Windows installer and ZIP
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in @('.exe', '.zip') }
          if (-not $files -or @($files).Count -lt 2) {
            Get-ChildItem -Path release -Force -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw 'Expected both a Windows installer (.exe) and ZIP package in release/.'
          }
          $files | Format-Table Name, Length
