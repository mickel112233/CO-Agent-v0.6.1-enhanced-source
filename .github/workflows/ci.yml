name: CO-Agent CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: co-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Set up Rust toolchain for desktop pet
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
      - name: Install desktop pet frontend dependencies
        if: runner.os == 'Windows'
        run: npm ci --prefix integrations/AI-Desktop-Pet
      - name: Build desktop pet frontend
        if: runner.os == 'Windows'
        run: npm run build --prefix integrations/AI-Desktop-Pet
      - name: Build desktop pet Windows executable
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path integrations/AI-Desktop-Pet/src-tauri/Cargo.toml
      - name: Verify desktop pet executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pet = 'integrations/AI-Desktop-Pet/src-tauri/target/release/convai-desktop-pet.exe'
          if (-not (Test-Path $pet -PathType Leaf)) { throw "Desktop pet executable was not built: $pet" }
          Get-Item $pet | Format-Table Name, Length
      - name: Package Windows installer and ZIP
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify release artifacts
        if: runner.os == 'Windows'
        run: npm run verify:release
      - name: Verify Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in @('.exe', '.zip') }
          if (-not $files -or @($files).Count -lt 2) {
            Get-ChildItem -Path release -Force -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw 'Expected both a Windows installer (.exe) and ZIP package in release/.'
          }
          $files | Format-Table Name, Length
      - name: Smoke-test standalone ZIP package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'release\*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Standalone ZIP package not found.' }
          $zipDir = Join-Path $env:RUNNER_TEMP 'CO-Agent-ZIP-Smoke'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $zipDir -Force
          $zipExe = Join-Path $zipDir 'CO-Agent.exe'
          if (-not (Test-Path $zipExe)) { Get-ChildItem $zipDir -Recurse | Select-Object FullName; throw 'CO-Agent.exe missing from standalone ZIP.' }
          foreach ($required in @('resources\pet\convai-desktop-pet.exe','resources\pet-assets\albedo\\id1_1.png','resources\pet-assets\LICENSE','resources\pet-assets\licenses\\licence.txt','resources\THIRD-PARTY-NOTICES.txt')) {
            if (-not (Test-Path (Join-Path $zipDir $required))) { throw "ZIP package missing required resource: $required" }
          }
          $zipSmoke = Start-Process -FilePath $zipExe -ArgumentList '--co-agent-smoke-test' -Wait -PassThru -NoNewWindow
          if ($zipSmoke.ExitCode -ne 0) { throw "Standalone ZIP smoke test exited with code $($zipSmoke.ExitCode)." }
      - name: Install and smoke-test NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release\*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'CO-Agent-Installed-Smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $installedExe = Join-Path $installDir 'CO-Agent.exe'
          if (-not (Test-Path $installedExe)) { Get-ChildItem $installDir -Recurse | Select-Object FullName; throw 'Installed CO-Agent.exe not found.' }
          $installSmoke = Start-Process -FilePath $installedExe -ArgumentList '--co-agent-smoke-test' -Wait -PassThru -NoNewWindow
          if ($installSmoke.ExitCode -ne 0) { throw "Installed app smoke test exited with code $($installSmoke.ExitCode)." }
          $uninstaller = Join-Path $installDir 'Uninstall CO-Agent.exe'
          if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }
