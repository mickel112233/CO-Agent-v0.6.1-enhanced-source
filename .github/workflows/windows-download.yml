name: CO-Agent Windows Download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: co-agent-windows-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-package:
    name: Test and package Windows app
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Set up Rust toolchain for desktop pet
        uses: dtolnay/rust-toolchain@stable

      - name: Build desktop pet runtime
        run: npm run build:pet:win

      - name: Build renderer
        run: npm run build

      - name: Package Windows installer and ZIP
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify release artifacts
        run: npm run verify:release

      - name: Smoke-test standalone ZIP package
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'release\*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Standalone ZIP package not found.' }
          $zipDir = Join-Path $env:RUNNER_TEMP 'CO-Agent-ZIP-Smoke'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $zipDir -Force
          $zipExe = Join-Path $zipDir 'CO-Agent.exe'
          if (-not (Test-Path $zipExe)) { throw 'CO-Agent.exe missing from standalone ZIP.' }
          foreach ($required in @('resources\pet\convai-desktop-pet.exe','resources\pet-assets\LICENSE','resources\THIRD-PARTY-NOTICES.txt')) {
            if (-not (Test-Path (Join-Path $zipDir $required))) { throw "ZIP package missing required resource: $required" }
          }
          $smoke = Start-Process -FilePath $zipExe -ArgumentList '--co-agent-smoke-test' -Wait -PassThru -NoNewWindow
          if ($smoke.ExitCode -ne 0) { throw "ZIP smoke test exited with code $($smoke.ExitCode)." }

      - name: Install and smoke-test NSIS package
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release\*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'CO-Agent-Installed-Smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $installedExe = Join-Path $installDir 'CO-Agent.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed CO-Agent.exe not found.' }
          $smoke = Start-Process -FilePath $installedExe -ArgumentList '--co-agent-smoke-test' -Wait -PassThru -NoNewWindow
          if ($smoke.ExitCode -ne 0) { throw "Installed app smoke test exited with code $($smoke.ExitCode)." }
          $uninstaller = Join-Path $installDir 'Uninstall CO-Agent.exe'
          if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }

      - name: Verify downloadable files exist
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in @('.exe', '.zip') }
          if (-not $files -or @($files).Count -lt 2) {
            Get-ChildItem -Path release -Force -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw 'Expected both a Windows installer (.exe) and ZIP package in release/.'
          }
          $files | Format-Table Name, Length

      - name: Upload Windows build for download
        uses: actions/upload-artifact@v4
        with:
          name: CO-Agent-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

