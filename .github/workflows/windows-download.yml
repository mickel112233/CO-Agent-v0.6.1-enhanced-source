name: CO-Agent Windows Download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: co-agent-windows-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-package:
    name: Test and package Windows app
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Set up Rust toolchain for desktop pet
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop pet frontend dependencies
        run: npm ci --prefix integrations/AI-Desktop-Pet

      - name: Build desktop pet frontend
        run: npm run build --prefix integrations/AI-Desktop-Pet

      - name: Build desktop pet Windows executable
        run: cargo build --release --manifest-path integrations/AI-Desktop-Pet/src-tauri/Cargo.toml

      - name: Verify desktop pet executable
        shell: pwsh
        run: |
          $pet = 'integrations/AI-Desktop-Pet/src-tauri/target/release/convai-desktop-pet.exe'
          if (-not (Test-Path $pet -PathType Leaf)) { throw "Desktop pet executable was not built: $pet" }
          Get-Item $pet | Format-Table Name, Length

      - name: Package Windows installer and ZIP
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify release artifact contents
        run: npm run verify:release

      - name: Verify downloadable files exist
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in @('.exe', '.zip') }
          if (-not $files -or @($files).Count -lt 2) {
            Get-ChildItem -Path release -Force -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw 'Expected both a Windows installer (.exe) and ZIP package in release/.'
          }
          $files | Format-Table Name, Length

      - name: Upload Windows build for download
        uses: actions/upload-artifact@v4
        with:
          name: CO-Agent-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

