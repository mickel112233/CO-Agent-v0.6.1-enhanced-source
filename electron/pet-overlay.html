<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CO-Agent Companion</title>
<style>
:root{color-scheme:light;font-family:Segoe UI,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:transparent;color:#252920;user-select:none}
.pet{border:1px solid #e0e5d9;background:rgba(250,252,247,.97);border-radius:22px;box-shadow:0 12px 38px #0002;padding:12px;display:grid;gap:9px}
.top{display:flex;align-items:center;gap:10px;cursor:move;-webkit-app-region:drag}.avatar{width:72px;height:72px;border-radius:18px;background:#e9efe3;display:grid;place-items:center;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.heading{font-weight:750;font-size:13px}.status{font-size:11px;color:#72786c;margin-top:3px;line-height:1.35}.close{margin-left:auto;border:0;background:transparent;font-size:20px;cursor:pointer;-webkit-app-region:no-drag;color:#6b7166}
form{display:flex;gap:6px}input{min-width:0;flex:1;border:1px solid #dfe4d8;border-radius:12px;padding:10px;background:white;font:inherit;font-size:12px;outline-color:#8ba77b}button.send{border:0;border-radius:11px;background:#30372d;color:white;padding:0 13px;font-weight:650;cursor:pointer}.hint{font-size:10px;color:#858a7e}
</style></head><body><section class="pet">
<div class="top"><div class="avatar"><img id="sprite" alt="CO-Agent desktop companion"/></div><div><div class="heading">CO-Agent companion</div><div class="status" id="status">Ready when you are</div></div><button class="close" id="close" title="Hide companion" aria-label="Hide companion">×</button></div>
<form id="form"><input id="message" maxlength="4000" placeholder="Tell CO-Agent what to do…" autocomplete="off" aria-label="Message CO-Agent"><button class="send" type="submit">Send</button></form><div class="hint">Your message opens in CO-Agent chat. Computer actions still require approval.</div>
</section><script>
const statusEl=document.getElementById('status'),form=document.getElementById('form'),input=document.getElementById('message'),sprite=document.getElementById('sprite');
const assetRoot=new URLSearchParams(location.search).get('assetRoot');const frames=['id1_1.png','id2_1.png','walk1.png','walk2.png','walk3.png'];let frameIndex=0;
function setFrame(name){if(!assetRoot)return;sprite.src=new URL(name,new URL(assetRoot)).href;}
sprite.addEventListener('error',()=>{sprite.style.display='none';});setFrame(frames[0]);setInterval(()=>{frameIndex=(frameIndex+1)%frames.length;setFrame(frames[frameIndex]);},260);
form.addEventListener('submit',event=>{event.preventDefault();const text=input.value.trim();if(!text)return;window.coAgentPet.sendMessage(text);statusEl.textContent='Sent to CO-Agent chat…';input.value='';});
document.getElementById('close').addEventListener('click',()=>window.coAgentPet.close());window.coAgentPet.onStatus(text=>{statusEl.textContent=text||'Ready when you are';});
</script></body></html>
